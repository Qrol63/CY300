{% extends "account_homepage/base.html" %}

{% block content %}

  <p><a href="{% url 'account_homepage:topic' topic.id %}">{{ topic }}</a></p>

  <p>Add a new entry:</p>
  <form action="{% url 'account_homepage:new_entry' topic.id %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}
    <button name='submit'>Add entry</button>

  </form>

{% endblock content %}
