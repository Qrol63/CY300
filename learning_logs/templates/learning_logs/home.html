{% extends 'learning_logs/base.html' %}

{% block page_header %}
  <div class="p-3 mb-4 bg-light border rounded-3">
    <div class="container-fluid py-4">
      <h1 class="display-3">Welcome back!</h1>
      
      <p class="lead">Continue tracking your learning journey. View your 
      topics, add new entries, or explore what you've learned so far.</p>

      <div class="mt-3">
        <a class="btn btn-primary btn-lg me-2"
            href="{% url 'learning_logs:topics' %}">View Topics &raquo;</a>
        <a class="btn btn-outline-primary btn-lg"
            href="{% url 'learning_logs:new_topic' %}">New Topic</a>
      </div>
    </div>
  </div>
{% endblock page_header %}
