{% extends 'learning_logs/base.html' %}

{% block page_header %}
  <div class="p-3 mb-4 bg-light border rounded-3">
    <div class="container-fluid py-4">
      <h1 class="display-4">Welcome back, {{ user.username }}!</h1>
      <p class="lead">Track your habits and build consistency.</p>
    </div>
  </div>
{% endblock page_header %}

{% block content %}
<style>
  .calendar-container {
    max-width: 800px;
    margin: 0 auto;
  }
  
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    margin-top: 20px;
  }
  
  .calendar-day-label {
    text-align: center;
    font-weight: bold;
    padding: 10px;
    background-color: #e9ecef;
    border-radius: 5px;
  }
  
  .calendar-day {
    aspect-ratio: 1;
    border: 2px solid #dee2e6;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1.1rem;
  }
  
  .calendar-day:hover {
    border-color: #0d6efd;
    background-color: #f8f9fa;
  }
  
  .calendar-day.other-month {
    opacity: 0.3;
    cursor: default;
  }
  
  .calendar-day.today {
    background-color: #0d6efd;
    color: white;
    font-weight: bold;
  }
  
  .calendar-day.selected {
    background-color: #198754;
    color: white;
    border-color: #198754;
  }
  
  .month-nav-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 5px 15px;
    color: #0d6efd;
  }
  
  .month-nav-btn:hover {
    color: #0a58ca;
  }
</style>

<div class="calendar-container">
  <div class="calendar-header">
    <button class="month-nav-btn" onclick="previousMonth()">←</button>
    <h2 id="monthYear"></h2>
    <button class="month-nav-btn" onclick="nextMonth()">→</button>
  </div>
  
  <div class="calendar-grid" id="calendar"></div>
</div>

<script>
  let currentDate = new Date();
  let selectedDates = new Set();
  
  const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    
    document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    
    const calendar = document.getElementById('calendar');
    calendar.innerHTML = '';
    
    // Day labels
    dayLabels.forEach(day => {
      const label = document.createElement('div');
      label.className = 'calendar-day-label';
      label.textContent = day;
      calendar.appendChild(label);
    });
    
    // Previous month days
    for (let i = firstDay - 1; i >= 0; i--) {
      const day = createDayElement(daysInPrevMonth - i, true);
      calendar.appendChild(day);
    }
    
    // Current month days
    for (let i = 1; i <= daysInMonth; i++) {
      const day = createDayElement(i, false);
      calendar.appendChild(day);
    }
    
    // Next month days
    const remainingDays = 42 - (firstDay + daysInMonth);
    for (let i = 1; i <= remainingDays; i++) {
      const day = createDayElement(i, true);
      calendar.appendChild(day);
    }
  }

  function createDayElement(dayNum, isOtherMonth) {
    const day = document.createElement('div');
    day.className = 'calendar-day';
    day.textContent = dayNum;
    
    if (isOtherMonth) {
      day.classList.add('other-month');
      return day;
    }
    
    // Check if today
    const today = new Date();
    if (dayNum === today.getDate() && 
        currentDate.getMonth() === today.getMonth() && 
        currentDate.getFullYear() === today.getFullYear()) {
      day.classList.add('today');
    }
    
    // Check if selected
    const dateKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${dayNum}`;
    if (selectedDates.has(dateKey)) {
      day.classList.add('selected');
    }
    
    day.onclick = () => toggleDate(dayNum);
    
    return day;
  }

  function toggleDate(dayNum) {
    const dateKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${dayNum}`;
    
    if (selectedDates.has(dateKey)) {
      selectedDates.delete(dateKey);
    } else {
      selectedDates.add(dateKey);
    }
    
    renderCalendar();
  }

  function previousMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  // Initialize calendar
  renderCalendar();
</script>
{% endblock content %}
